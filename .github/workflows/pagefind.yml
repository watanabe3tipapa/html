name: Build and Deploy Pagefind Index

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Pagefind
        run: npm install -g pagefind

      - name: Generate Content Index
        run: |
          python3 << 'PYEOF'
          import os
          import re
          import glob

          content_dir = "content"
          index_path = "index.html"

          def extract_title(filepath):
              try:
                  with open(filepath, "r", encoding="utf-8") as f:
                      content = f.read()
                  m = re.search(r"<title[^>]*>(.*?)</title>", content, re.IGNORECASE | re.DOTALL)
                  if m:
                      return re.sub(r"\s+", " ", m.group(1)).strip()
              except Exception:
                  pass
              return os.path.splitext(os.path.basename(filepath))[0]

          files = sorted(glob.glob(os.path.join(content_dir, "*.html")))
          items = []
          for filepath in files:
              filename = os.path.basename(filepath)
              title = extract_title(filepath)
              items.append((filename, title))

          if items:
              lis = []
              for filename, title in items:
                  lis.append(
                      '<li><a href="{dir}/{file}"><span class="c-title">{title}</span>'
                      '<span class="c-file">{file}</span></a></li>'.format(
                          dir=content_dir, file=filename, title=title
                      )
                  )
              list_html = '<ul class="content-list">\n' + "\n".join(lis) + "\n</ul>"
          else:
              list_html = '<p class="content-empty">コンテンツがありません</p>'

          new_block = (
              "<!-- CONTENT:START -->\n"
              "<!-- This section is auto-generated by GitHub Actions. Do not edit manually. -->\n"
              + list_html + "\n"
              "<!-- CONTENT:END -->"
          )

          with open(index_path, "r", encoding="utf-8") as f:
              content = f.read()

          start = "<!-- CONTENT:START -->"
          end = "<!-- CONTENT:END -->"

          if start not in content or end not in content:
              print("ERROR: CONTENT markers not found in index.html")
              raise SystemExit(1)

          before = content.split(start)[0]
          after = content.split(end)[1]
          content = before + new_block + after

          with open(index_path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Content index injected: {} files".format(len(items)))
          PYEOF

      - name: Generate Pagefind Index
        run: pagefind --verbose
        # pagefind.yml in the repo root is loaded automatically

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
