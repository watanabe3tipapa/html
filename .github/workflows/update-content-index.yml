name: Update Content Index

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect content HTML files and update index.html
        run: |
          python3 << 'PYEOF'
          import os
          import re
          import glob

          content_dir = "content"
          index_path = "index.html"

          def extract_title(filepath):
              try:
                  with open(filepath, "r", encoding="utf-8") as f:
                      content = f.read()
                  m = re.search(r"<title[^>]*>(.*?)</title>", content, re.IGNORECASE | re.DOTALL)
                  if m:
                      return re.sub(r"\s+", " ", m.group(1)).strip()
              except Exception:
                  pass
              return os.path.splitext(os.path.basename(filepath))[0]

          files = sorted(glob.glob(os.path.join(content_dir, "*.html")))
          items = []
          for filepath in files:
              filename = os.path.basename(filepath)
              title = extract_title(filepath)
              items.append((filename, title))

          list_html = ""
          if items:
              lis = []
              for filename, title in items:
                  lis.append(
                      '<li><a href="{dir}/{file}"><span class="c-title">{title}</span>'
                      '<span class="c-file">{file}</span></a></li>'.format(
                          dir=content_dir, file=filename, title=title
                      )
                  )
              list_html = '<ul class="content-list">\n' + "\n".join(lis) + "\n</ul>"
          else:
              list_html = '<p class="content-empty">コンテンツがありません</p>'

          new_block = (
              "<!-- CONTENT:START -->\n"
              "<!-- This section is auto-generated by GitHub Actions. Do not edit manually. -->\n"
              + list_html + "\n"
              "<!-- CONTENT:END -->"
          )

          with open(index_path, "r", encoding="utf-8") as f:
              content = f.read()

          start = "<!-- CONTENT:START -->"
          end = "<!-- CONTENT:END -->"

          if start in content and end in content:
              before = content.split(start)[0]
              after = content.split(end)[1]
              content = before + new_block + after
          else:
              print("ERROR: CONTENT markers not found in index.html")
              raise SystemExit(1)

          with open(index_path, "w", encoding="utf-8") as f:
              f.write(content)

          print("index.html updated with {} content files.".format(len(items)))
          PYEOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update content index in index.html [skip ci]"
            git push
          fi