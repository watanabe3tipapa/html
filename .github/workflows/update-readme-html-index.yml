name: Update README HTML Index

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect HTML files and update README
        run: |
          python3 << 'PYEOF'
          import os
          import subprocess

          def collect_html_files():
              result = subprocess.run(
                  ["find", ".", "-name", "*.html",
                   "-not", "-path", "*/\.git/*",
                   "-not", "-path", "*/node_modules/*",
                   "-not", "-path", "*/\.github/*"],
                  capture_output=True, text=True
              )
              lines = sorted(result.stdout.strip().split("\n"))
              html_files = []
              for line in lines:
                  line = line.lstrip("./")
                  if line and line.endswith(".html"):
                      html_files.append(line)
              return html_files

          html_files = collect_html_files()
          file_count = len(html_files)

          output_lines = ["."]
          for i, filepath in enumerate(html_files):
              parts = filepath.split("/")
              depth = len(parts) - 1
              indent = "    " * depth
              is_last = (i == file_count - 1)
              connector = "`-- " if is_last else "|-- "
              output_lines.append(indent + connector + parts[-1])

          tree_output = "\n".join(output_lines)

          readme_path = "README.md"
          if os.path.exists(readme_path):
              with open(readme_path, "r", encoding="utf-8") as f:
                  content = f.read()
          else:
              content = "# README\n"

          marker_start = "<!-- HTML-INDEX:START -->"
          marker_end = "<!-- HTML-INDEX:END -->"

          new_block = (
              marker_start + "\n"
              "<!-- This section is auto-generated by GitHub Actions. Do not edit manually. -->\n\n"
              "```\n"
              + tree_output + "\n"
              "```\n\n"
              "*" + str(file_count) + " HTML file" +
              ("s" if file_count != 1 else "") + " indexed*\n\n"
              + marker_end
          )

          if marker_start in content and marker_end in content:
              before = content.split(marker_start)[0]
              after = content.split(marker_end)[1]
              content = before + new_block + after
          else:
              content = (
                  content.rstrip() + "\n\n## HTML Files\n\n" +
                  new_block + "\n"
              )

          with open(readme_path, "w", encoding="utf-8") as f:
              f.write(content)

          print("README.md updated with " + str(file_count) + " HTML files.")
          PYEOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update HTML file index in README [skip ci]"
            git push
          fi
