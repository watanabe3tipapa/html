name: Update README Structure

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tree and update README
        run: |
          python3 << 'PYEOF'
          import os
          import subprocess

          def generate_tree():
              result = subprocess.run(
                  ["tree", "-I", "node_modules|.git|.github", "--noreport"],
                  capture_output=True, text=True
              )
              if result.returncode == 0:
                  return result.stdout.strip()

              result = subprocess.run(
                  ["find", ".", "-not", "-path", "*/\.git/*",
                   "-not", "-path", "*/node_modules/*",
                   "-not", "-path", "*/\.github/*"],
                  capture_output=True, text=True
              )
              lines = sorted(result.stdout.strip().split("\n"))
              cleaned = []
              for line in lines:
                  line = line.lstrip("./")
                  if line:
                      cleaned.append(line)
              return "\n".join(cleaned) if cleaned else "."

          tree_output = generate_tree()

          readme_path = "README.md"
          if os.path.exists(readme_path):
              with open(readme_path, "r", encoding="utf-8") as f:
                  content = f.read()
          else:
              content = "# README\n"

          marker_start = "<!-- STRUCTURE:START -->"
          marker_end = "<!-- STRUCTURE:END -->"

          item_count = len([l for l in tree_output.split("\n") if l.strip()])

          new_block = (
              marker_start + "\n"
              "<!-- This section is auto-generated by GitHub Actions. Do not edit manually. -->\n\n"
              "```\n"
              + tree_output + "\n"
              "```\n\n"
              "*" + str(item_count) + " items indexed*\n\n"
              + marker_end
          )

          if marker_start in content and marker_end in content:
              before = content.split(marker_start)[0]
              after = content.split(marker_end)[1]
              content = before + new_block + after
          else:
              content = content.rstrip() + "\n\n## Site Structure\n\n" + new_block + "\n"

          with open(readme_path, "w", encoding="utf-8") as f:
              f.write(content)

          print("README.md updated successfully.")
          PYEOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update site structure in README [skip ci]"
            git push
          fi
